
<!DOCTYPE html>
<html>
<head>
    <title>ATM Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>🏧 ATM DASHBOARD</h1>
    <h2>Welcome!</h2>

    <p>Account Number: <b>{{ session.account_no }}</b></p>

    <div class="balance">
        Available Balance<br>
        ₹{{ balance }}
    </div>

    <a href="{{ url_for('balance') }}"><button>CHECK BALANCE</button></a>
    <a href="{{ url_for('deposit') }}"><button>DEPOSIT MONEY</button></a>
    <a href="{{ url_for('withdraw') }}"><button>WITHDRAW MONEY</button></a>
    <a href="{{ url_for('statement') }}"><button>MINI STATEMENT</button></a>
    <a href="{{ url_for('logout') }}"><button class="logout">LOGOUT</button></a>
</div>
</body>
</html>
